[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dot-explorer"
version = "0.1.0"
description = "Fast dot plot comparisons of DNA sequences using a canonical ntHash k-mer index"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
keywords = ["bioinformatics", "dotplot", "sequence-comparison"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    # Binary wheels are published for each of these, plus 3.14t.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["matplotlib>=3.5", "numpy>=1.21"]

[project.optional-dependencies]
test = [
        "pytest-codspeed",
        "pytest-cov",
        "pytest",
        "toml",
        ]
dev = [
    "isort",
    "maturin>=1.0",
    "mypy",
    "numpydoc-validation",
    "pre-commit",
    "pydocstyle",
    "ruff",
]

# Local Shiny front end: `pip install "dot-explorer[app]"` (or `.[app]` from a
# checkout), then `shiny run --launch-browser app/app.py` from the repo root.
app = [
    "shiny",
    "pyfaidx",
]

# Similarity/clustering features: sourmash sketches + scipy linkage.
# Floor, not pin: the browser app runs Pyodide's bundled sourmash 4.8.11,
# so library code must stick to 4.8-era sourmash APIs.
cluster = [
    "sourmash>=4.8",
    "scipy>=1.10",
]

docs = [
    "zensical>=0.0.57",
    "mkdocstrings-python>=2.0",
    # Zensical has no notebook support; scripts/notebooks_to_md.py renders
    # docs/tutorials/*.ipynb to Markdown before the build.
    "nbconvert>=7.0",
]

[project.urls]
documentation = "https://adamtaranto.github.io/dot-explorer/"
homepage = "https://github.com/adamtaranto/dot-explorer"
repository = "https://github.com/adamtaranto/dot-explorer"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "dot_explorer._dot_explorer"
# Bundle the HTML report assets (template/CSS/JS) into wheels and sdists.
include = [{ path = "python/dot_explorer/_html/**/*", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
addopts = "-v --cov=dot_explorer --cov-branch --cov-report=xml --cov-report=term"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "private_data: benchmarks against private local assemblies (opt-in via DOT_EXPLORER_PRIVATE_DATA=1; data never committed)",
]

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true
exclude = ["docs"]

[tool.ruff.lint]
select = [
    "C", # mccabe rules
    "F", # pyflakes rules
    "E", # pycodestyle error rules
    "W", # pycodestyle warning rules
    "B", # flake8-bugbear rules
    "I", # isort rules
    "D", # pydocstyle rules
]
ignore = [
    "C901", # max-complexity-10
    "E501", # line-too-long
    #"I001", # isort-imports
    "B905", # `zip()` without an explicit `strict=` parameter
]

# Don't auto-fix docstring issues - they're too fragile
unfixable = ["D"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # Ignore all pydocstyle rules in tests
# The Shiny app is UI wiring: dozens of tiny reactive closures where
# per-function docstrings add noise.  app/core/ (the logic) keeps full D rules.
"app/app.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["dot_explorer"]
known-third-party = ["matplotlib", "numpy"]

[tool.isort]
profile = "black"
known_third_party = ["matplotlib", "numpy"]
known_first_party = ["dot_explorer"]
default_section = "THIRDPARTY"
force_sort_within_sections = true

[tool.numpydoc_validation]
checks = [
    "all",  # report on all checks
    "ES01", # but don't require an extended summary
    "EX01", # or examples
    "SA01", # or a see also section
    "SS06", # and don't require the summary to fit on one line
]
exclude = [ # don't report on checks for these
    '\.__init__$',
    '\.__repr__$',
    '\.__str__$',
]
override_SS05 = [ # allow docstrings to start with these words
    '^Process ',
    '^Assess ',
    '^Access ',
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pydocstyle]
convention = "numpy"
match-dir = "[^\\.].*"     # matches all dirs that don't start with a dot
match = "(?!test_).*\\.py" # matches files that don't start with 'test_' but end with '.py'
