name: dot-explorer
channels:
  - conda-forge
  - bioconda
dependencies:
  - minimap2
  - pip
  - python 3.14
  #- python-freethreading # Use only for dot-explorer library. Not compatible with Shiny.
  - pip:
      - maturin
      - matplotlib
      - numpy
      # Local Shiny front end (`shiny run --launch-browser app/app.py`).
      - shiny
      - pyfaidx
